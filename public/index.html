<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Site</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;

  /* الخلفية مثل الصورة */
  background: radial-gradient(circle at 20% 20%, blue, red, lime);
}

/* المستطيل الكبير */
.container{
  width:300px;
  height:520px;
  border:5px solid black;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:20px;

  /* كحلي غامق */
  background:#0b1a3a;
}

/* الحقول */
input{
  width:220px;
  padding:10px;
  margin:10px;
  border:3px solid black;
  font-size:18px;
  background:transparent;
  color:black;
}

/* الدائرة */
.avatar{
  width:90px;
  height:90px;
  border:4px solid black;
  border-radius:50%;
  margin:20px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* زر OK */
button{
  width:220px;
  height:110px;
  font-size:60px;
  border:4px solid black;
  background:transparent;
  cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

  <input id="username" placeholder="user name">
  <input id="password" type="password" placeholder="password">

  <div class="avatar" id="avatarBox"></div>

  <button onclick="go()">ok</button>

</div>

<script>
async function go(){
  let username = document.getElementById("username").value;
  let box = document.getElementById("avatarBox");

  if(username === ""){
    alert("اكتب اسم المستخدم");
    return;
  }

  try{
    let res = await fetch("/avatar",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username})
    });

    let data = await res.json();

    if(data.image){
      box.innerHTML = "<img src='"+data.image+"'>";
    }else{
      alert("اسم غير صحيح");
    }

  }catch{
    alert("السيرفر غير شغال");
  }
}
</script>

</body>
</html>
