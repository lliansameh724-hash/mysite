<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Secret Messages</title>

<style>
body{
  background: linear-gradient(135deg,#667eea,#764ba2);
  font-family:Arial;
  text-align:center;
  color:white;
}

.box{
  background:white;
  color:black;
  width:300px;
  margin:80px auto;
  padding:20px;
  border-radius:15px;
}

input{
  width:90%;
  padding:10px;
  margin:10px;
}

button{
  padding:10px;
  background:#667eea;
  color:white;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="box">

<h3>Roblox</h3>

<input id="username" placeholder="اسم روبلوكس">
<button onclick="getAvatar()">OK</button>

<div id="avatar"></div>

<div id="secretBox" style="display:none;">
  <input id="msgInput" placeholder="إرسال سري">
  <button onclick="sendMsg()">إرسال</button>
</div>

<hr>

<input id="secretCode" placeholder="كود مشاهدة الرسائل">
<button onclick="check()">عرض</button>

<div id="msgs" style="display:none;"></div>

</div>

<script>
// جلب الأفاتار
async function getAvatar(){
  let username = document.getElementById("username").value;

  let res = await fetch("/avatar",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({username})
  });

  let data = await res.json();

  if(data.image){
    document.getElementById("avatar").innerHTML =
      "<img src='"+data.image+"' width='120'>";

    document.getElementById("secretBox").style.display = "block";
  }else{
    alert("اسم غلط");
  }
}

// إرسال الرسالة
async function sendMsg(){
  let msg = document.getElementById("msgInput").value;
  let username = document.getElementById("username").value;

  let res = await fetch("/send-message",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({message:msg, username:username})
  });

  let data = await res.json();

  if(data.success){
    alert("تم الإرسال");
  }else{
    alert("خطأ");
  }
}

// التحقق من الكود
function check(){
  let code = document.getElementById("secretCode").value;

  if(code === "123321456654"){
    loadMessages();
  }else{
    alert("كود خطأ");
  }
}

// عرض الرسائل
async function loadMessages(){
  let res = await fetch("/messages");
  let data = await res.json();

  let html = "";
  data.reverse().forEach(m=>{
    html += "<p>"+m.user+" : "+m.text+"</p><hr>";
  });

  document.getElementById("msgs").innerHTML = html;
  document.getElementById("msgs").style.display = "block";
}
</script>

</body>
</html>
