<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Site</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial;background:#0b1a3a;}
.container{width:320px;border:4px solid #000;padding:16px;text-align:center;background:#0f2a5a;color:#fff}
input{width:90%;padding:10px;margin:8px 0;border:2px solid #000}
button{width:95%;padding:10px;border:2px solid #000;cursor:pointer}
.avatar{width:90px;height:90px;border:3px solid #000;border-radius:50%;margin:10px auto;overflow:hidden}
.avatar img{width:100%;height:100%}
#messageBox{display:none}
#status{color:#9ef59e}
</style>
</head>
<body>

<div class="container">
  <input id="username" placeholder="user name">
  <div class="avatar" id="avatarBox"></div>
  <button onclick="go()">OK</button>

  <div id="messageBox">
    <input id="msgInput" placeholder="اكتب رسالتك">
    <button onclick="sendMsg()">إرسال</button>
    <div id="status"></div>
  </div>
</div>

<script>
async function go(){
  const username = document.getElementById("username").value.trim();
  const box = document.getElementById("avatarBox");
  document.getElementById("messageBox").style.display = "none";

  if(!username){ alert("اكتب اسم المستخدم"); return; }

  try{
    const res = await fetch("/avatar",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username})
    });
    const data = await res.json();

    if(data.image){
      box.innerHTML = "<img src='"+data.image+"'>";
      document.getElementById("messageBox").style.display = "block";
    }else{
      box.innerHTML = "";
      alert("اسم غير صحيح");
    }
  }catch{
    alert("السيرفر غير شغال");
  }
}

async function sendMsg(){
  const msg = document.getElementById("msgInput").value;
  const status = document.getElementById("status");

  if(!msg){ status.innerText = "اكتب رسالة"; return; }

  try{
    const res = await fetch("/send-email",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:msg})
    });
    const data = await res.json();

    if(data.success){
      status.innerText = "تم الإرسال";
    }else{
      status.innerText = "خطأ";
    }
  }catch{
    status.innerText = "السيرفر غير شغال";
  }
}
</script>

</body>
</html>
