<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Site</title>
</head>

<body>

<input id="username" placeholder="username">
<button onclick="go()">OK</button>

<br><br>

<div id="avatarBox"></div>

<br>

<div id="messageBox" style="display:none;">
  <input id="msgInput" placeholder="اكتب رسالة">
  <button onclick="sendMsg()">إرسال</button>
</div>

<script>
async function go(){
  let username = document.getElementById("username").value;

  let res = await fetch("/avatar",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({username})
  });

  let data = await res.json();

  if(data.image){
    document.getElementById("avatarBox").innerHTML =
      "<img src='"+data.image+"' width='100'>";
    document.getElementById("messageBox").style.display = "block";
  }else{
    alert("اسم غلط");
  }
}

async function sendMsg(){
  let msg = document.getElementById("msgInput").value;

  if(msg === ""){
    alert("اكتب رسالة");
    return;
  }

  try{
    let res = await fetch("/send-email",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:msg})
    });

    let data = await res.json();

    if(data.success){
      alert("تم الإرسال");
    }else{
      alert("خطأ في الإرسال");
    }

  }catch(e){
    alert("السيرفر غير شغال");
  }
}
</script>

</body>
</html>
