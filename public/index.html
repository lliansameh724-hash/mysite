<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Site</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background: radial-gradient(circle at 20% 20%, blue, red, lime);
}

.container{
  width:300px;
  height:520px;
  border:5px solid black;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:20px;
  background:#0b1a3a;
}

input{
  width:220px;
  padding:10px;
  margin:10px;
  border:3px solid black;
  font-size:18px;
}

.avatar{
  width:90px;
  height:90px;
  border:4px solid black;
  border-radius:50%;
  margin:20px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
}

button{
  width:220px;
  height:110px;
  font-size:50px;
  border:4px solid black;
  background:white;
  cursor:pointer;
}

/* صندوق الرسائل */
#messageBox{
  display:none;
  text-align:center;
  margin-top:10px;
}

#msgInput{
  width:200px;
  padding:8px;
}

#msgStatus{
  color:lightgreen;
}
</style>
</head>

<body>

<div class="container">

  <input id="username" placeholder="user name">

  <div class="avatar" id="avatarBox"></div>

  <button onclick="go()">OK</button>

  <!-- إرسال سر -->
  <div id="messageBox">
    <p style="color:white;">إرسال سر</p>
    <input id="msgInput" placeholder="اكتب رسالتك للإدارة">
    <br><br>
    <button onclick="sendMsg()">إرسال</button>
    <p id="msgStatus"></p>
  </div>

</div>

<script>
async function go(){
  let username = document.getElementById("username").value;
  let box = document.getElementById("avatarBox");

  document.getElementById("messageBox").style.display = "none";

  if(username === ""){
    alert("اكتب اسم المستخدم");
    return;
  }

  try{
    let res = await fetch("/avatar",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username})
    });

    let data = await res.json();

    if(data.image){
      box.innerHTML = "<img src='"+data.image+"'>";
      document.getElementById("messageBox").style.display = "block";
    }else{
      box.innerHTML = "";
      alert("اسم غير صحيح");
    }

  }catch{
    alert("السيرفر غير شغال");
  }
}

async function sendMsg(){
  let msg = document.getElementById("msgInput").value;
  let status = document.getElementById("msgStatus");

  if(msg === ""){
    status.innerText = "اكتب رسالة";
    return;
  }

  try{
    let res = await fetch("/send-email",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:msg})
    });

    let data = await res.json();

    if(data.success){
      status.innerText = "تم الإرسال";
    }else{
      status.innerText = "خطأ";
    }

  }catch{
    status.innerText = "السيرفر غير شغال";
  }
}
</script>

</body>
</html>
